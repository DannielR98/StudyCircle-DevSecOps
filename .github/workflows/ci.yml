name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    # 1. Kör automatiska tester (inkluderar BDD / affärslogik)
    - name: Run automated tests
      run: npm test

    # 2. SAST (Static Application Security Testing) med Semgrep
    - name: Run SAST Security Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: 
          p/security-audit
          p/expressjs

    # 3. Beroendeskanning av npm-paket (Bryter vid höga/kritiska sårbarheter)
    - name: Run security audit for vulnerabilities
      run: npm audit --audit-level=high