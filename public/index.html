<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyCircle - Logga in / Registrera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        .form-group {
            margin-bottom: 1rem;
        }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button[type="submit"]:hover { background-color: #0056b3; }
        .toggle-container {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        .toggle-btn {
            background: none;
            color: #007bff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
        }
        .toggle-btn:hover { text-decoration: underline; }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="form-title">Logga in</h2>
        
        <form id="auth-form">
            <div class="form-group">
                <label for="username">Användarnamn</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Lösenord</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn">Logga in</button>
        </form>

        <div id="response-message" class="message"></div>

        <div class="toggle-container">
            <span id="toggle-text">Har du inget konto?</span> 
            <button type="button" class="toggle-btn" id="switch-mode-btn">Registrera dig</button>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const switchModeBtn = document.getElementById('switch-mode-btn');
        const toggleText = document.getElementById('toggle-text');
        const authForm = document.getElementById('auth-form');
        const responseMessage = document.getElementById('response-message');

        // Växla mellan Logga in och Registrera
        switchModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            responseMessage.style.display = 'none';
            authForm.reset();

            if (isLoginMode) {
                formTitle.textContent = 'Logga in';
                submitBtn.textContent = 'Logga in';
                toggleText.textContent = 'Har du inget konto?';
                switchModeBtn.textContent = 'Registrera dig';
            } else {
                formTitle.textContent = 'Skapa konto';
                submitBtn.textContent = 'Registrera';
                toggleText.textContent = 'Har du redan ett konto?';
                switchModeBtn.textContent = 'Logga in';
            }
        });

        // Hantera formulärskick
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            responseMessage.style.display = 'none';

            try {
                if (!isLoginMode) {
                    // REGISTRERINGSROUTEN
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        responseMessage.textContent = `🎉 Kontot har skapats! Välkommen ${data.username}. Du kan nu logga in.`;
                        responseMessage.className = 'message success';
                        responseMessage.style.display = 'block';
                        
                        // Byt till inloggningsläge efter en stund
                        setTimeout(() => {
                            switchModeBtn.click();
                        }, 2000);
                    } else {
                        responseMessage.textContent = data.error || 'Kunde inte registrera konto.';
                        responseMessage.className = 'message error';
                        responseMessage.style.display = 'block';
                    }
                } else {
                    // INLOGGNING (Simulerad / eller mot eventuell inloggningsroute om ni har en)
                    // Håll till godo med meddelande tills vidare eller koppla mot valfri route
                    responseMessage.textContent = 'Inloggningsfunktionalitet styrs härifrån. (Koppla till er inloggningsroute om det finns någon).';
                    responseMessage.className = 'message success';
                    responseMessage.style.display = 'block';
                }
            } catch (err) {
                responseMessage.textContent = 'Kunde inte nå servern.';
                responseMessage.className = 'message error';
                responseMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
